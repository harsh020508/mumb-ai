name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --workspace -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --package simfrancisco

      - name: Build release binaries
        run: cargo build --release --package simfrancisco

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run geography & dataset verification
        run: |
          python3 scripts/verify_integration.py
          cargo run --package simfrancisco --bin validate -- --quiet

      - name: Docker build and boot smoke test
        run: |
          docker build -t mumb-ai-test .
          docker run -d --name mumb-ai-container -p 8080:8080 mumb-ai-test
          sleep 5
          docker logs mumb-ai-container
          curl -f http://127.0.0.1:8080/health || (docker logs mumb-ai-container && exit 1)
          curl -f http://127.0.0.1:8080/ready || (docker logs mumb-ai-container && exit 1)
          curl -f http://127.0.0.1:8080/api || (docker logs mumb-ai-container && exit 1)
          curl -f http://127.0.0.1:8080/ || (docker logs mumb-ai-container && exit 1)
          docker stop mumb-ai-container
          docker rm mumb-ai-container
