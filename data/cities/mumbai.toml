vote_facts = "Mumbai is India's financial capital and the wealthiest urban agglomeration in the country, with 18 million residents crammed into roughly 600 square kilometres. It is a hyper-dense, high-cost metropolis where housing affordability is the single most explosive political issue: average flats cost Rs 3 crore-plus and rents have spiralled, while 41% of the population lives in slums and migrant workers form the city's labour backbone. The electorate is heavily working-class and pragmatic, historically rewarding pro-poor platforms (Shiv Sena's original sons-of-the-soil nativism, later Maha Vikas Aghadi) yet also responding to infrastructure delivery, coastal-road and metro projects, and flood resilience after successive devastating monsoons. Mumbai's residents are acutely sensitive to the cost of living, civic chaos, corruption scandals, and the failure of trains and suburban rail to keep pace with growth. Religion and community identity (Hindu-Marathi, Gujarati, Muslim, Buddhist, Jain, South Indian) shape politics, but bread-and-butter economic anxiety dominates vote choice. Immigration from Bihar, UP, and across Maharashtra is highly salient: native-Marathi nativist sentiment clashes with the city's cosmopolitan openness."
belief_facts = "India holds first-past-the-post elections; Maharashtra state assembly and Mumbai municipal (BMC) elections are conducted under this system with a single-member, one-person-one-vote framework. The national electorate is 18+, with turnout varying sharply by age and class. Mumbai has a large Buddhist-Ambedkarite community whose voters lean firmly toward Dalit-rights and social-justice parties."

