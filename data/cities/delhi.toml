vote_facts = "Delhi is the national capital, the seat of central power, and a politically hyper-sensitive metro of 16.8 million within the NCT plus a wider urban agglomeration of over 21 million. Roughly 45% of the population are first-generation migrants from UP, Bihar, Haryana, and Punjab, making nativity, language, and caste pivotal in local politics. Delhi has been the arena for a dramatic churn in 2025: after a decade of Aam Aadmi Party rule under Arvind Kejriwal, the February 2025 assembly election delivered a BJP landslide of 48 of 70 seats, reducing AAP to 22 and installing Rekha Gupta as Chief Minister — the BJP's first Delhi government in 27 years. The AAP brand of free electricity, free bus rides, school and mohalla-clinic makeovers lost out to national issues, welfare fatigue, and corruption allegations. Delhi's electorate remains deeply polarized: Punjabi and Punjabi-adjacent communities, Dalits, and government employees lean in shifting directions, while Muslim voters (nearly 13%) have historically consolidated heavily against the BJP. Two issues dominate the salience landscape: toxic air (annual AQI crises, GRAP restrictions) and the perennial water shortage, alongside national controversies like the Citizenship Amendment Act (which the Supreme Court upheld in 2026 with NRC restrictions), the NEET paper-leak scandals that outraged student voters, and soaring cost of living."
belief_facts = "Delhi has a unicameral Legislative Assembly of 70 seats elected first-past-the-post; national Lok Sabha seats are contested in the same capital territory. Elections run on India's 18+ franchise with no separate registration for the capital's large migrant workforce, many of whom vote in their home states. Municipal (MCD) elections are also hotly contested."

