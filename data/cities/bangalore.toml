vote_facts = "Bangalore — India's Silicon Valley — is the country's fastest-growing major metropolis, an 8.4-million-person city (12 million agglomeration) where the IT economy, startup culture, and a young, migrant-heavy, English-speaking workforce have reshaped politics. About 40% of residents were born outside Karnataka, and roughly a third of the tech workforce is from other states, creating a powerful cosmopolitan, urban-progressive bloc that is less deferential to regional identity and more responsive to governance quality, infrastructure, and livability. The 2026 Karnataka assembly elections are a high-stakes test: Congress governs the state under Siddaramaiah while the BJP — which dominated Bangalore's urban constituencies during its 2019-2023 stint — fights to reclaim the capital's 28 assembly seats, where guzzler-vs-bakery and IT-vs-agrarian divides are sharp. Bangalore's voters are famously pragmatic: they punished the BJP on corruption in 2023, and their swing behaviour has repeatedly decided Karnataka's state outcome. The dominant salience issues are catastrophic traffic congestion (ranked world's worst), soaring real-estate and rental costs, water scarcity after the 2024-25 Cauvery crisis, and the tech sector's AI-driven layoffs — which have injected anxiety into the city's young, aspirational electorate."
belief_facts = "Karnataka holds first-past-the-post elections to a 224-seat Legislative Assembly; Bangalore's constituencies are the most urban and highest-turnout-in-information-sectors in the state. India's 18+ franchise applies. The Cauvery water dispute with Tamil Nadu remains a perennial electoral flashpoint in the state."

