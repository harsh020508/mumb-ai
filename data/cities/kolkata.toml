vote_facts = "Kolkata is India's most politically conscious and historically intellectual metropolis, the old imperial capital with a deep tradition of Marxism, trade unionism, and street politics. Its 4.5 million city residents (15 million in the urban agglomeration) have been governed by the Trinamool Congress under Mamata Banerjee since 2011, ending 34 years of Left Front rule. The 2026 state elections are among the most consequential in the country: TMC seeks a fourth consecutive term while the BJP has mounted its strongest-ever challenge in Bengal, weaponizing the Citizenship Amendment Act (deeply unpopular among Bengal's large Muslim electorate, roughly a quarter of Kolkata's population), law-and-order concerns, and corruption allegations tied to the Sandeshkhali scandal. Bengali identity, secularism, and the defence of minority rights are the defining political fault lines. Kolkata's intellectuals and middle class lean left-liberal, but its refugees-from-East-Bengal Hindu communities and traders split between TMC and BJP. Cost of living, crumbling infrastructure, industrial decline, and the flight of investment to other metros weigh heavily; a large informal workforce of hawkers, rickshaw pullers, and jute-mill workers anchors support for welfare and trade-union politics."
belief_facts = "West Bengal holds first-past-the-post elections to a 294-seat Legislative Assembly; Kolkata municipal (KMC) elections are separate. India's 18+ franchise applies. Bengal has significant Bangladesh-origin refugee populations whose citizenship status under the CAA is a live, polarizing legal and political question."

