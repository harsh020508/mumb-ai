vote_facts = "Jaipur, the Pink City and capital of Rajasthan, is a 3 million-person metropolis that combines a deep Rajput and Marwari trading heritage with rapid modern growth as the tourism and textile-and-gems gateway of the desert state. Rajasthan politics is a two-party seesaw between the BJP and Congress, and the 2026 assembly elections are approaching with the BJP's Bhajan Lal Sharma government facing anti-incumbency after a term punctuated by law-and-order incidents, farmer unrest, and the perennial shortage crises. Jaipur's urban electorate — traders, government servants, textile and gem artisans, and a growing student population — swings with national moods but is unusually sensitive to local delivery: water rationing as Bisalpur dam runs dry, tourism revenue, and the health of its handicraft economy. Caste arithmetic (Jats, Rajputs, Gurjars, and the large Meghwal/SC population) and religion (roughly 11% Muslim in the city) structure the vote, while the city's middle class and youth lean pragmatically between the two main national alliances."
belief_facts = "Rajasthan holds first-past-the-post elections to a 200-seat Legislative Assembly; Jaipur's urban constituencies are among the state's highest-turnout. India's 18+ franchise applies. The state's chronic water scarcity and recurring drought politics are perennial campaign themes."

