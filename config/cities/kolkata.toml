# kolkata (Kolkata Municipal Corporation) — UTM Zone 45N.

[pipeline]
meters_per_cell = 2.0
chunk_meters    = 250.0
lod_levels      = 6

[crs]
utm_epsg = "EPSG:32645"

[bbox_wgs84]
west  = 88.20
south = 22.40
east  = 88.50
north = 22.70

[land_ref]
lon = 88.3639
lat = 22.5726

[paths]
osm_pbf   = "data/kolkata.osm.pbf"
dem_tif   = "data/kolkata_dem.tif"
output_db = "artifacts/tiles_kolkata.db"
mapping_json = "artifacts/mapping_kolkata.json"

[elevation]
walkable_threshold_m = 1.5
flatten_buildings    = true

[collision]
building_floor_blocked = true

[atlas]
tile_width  = 32
tile_height = 32
columns     = 47
path = "assets/atlas.png"

[verify]
test_chunks = []
