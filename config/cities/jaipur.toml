# jaipur (Jaipur Municipal Corporation) — UTM Zone 43N.

[pipeline]
meters_per_cell = 2.0
chunk_meters    = 250.0
lod_levels      = 6
water_max_elev_m = 0.0

[crs]
utm_epsg = "EPSG:32643"

[bbox_wgs84]
west  = 75.72
south = 26.78
east  = 75.95
north = 27.00

[land_ref]
lon = 75.7873
lat = 26.9124

[paths]
osm_pbf   = "data/jaipur.osm.pbf"
dem_tif   = "data/jaipur_dem.tif"
output_db = "artifacts/tiles_jaipur.db"
mapping_json = "artifacts/mapping_jaipur.json"

[elevation]
